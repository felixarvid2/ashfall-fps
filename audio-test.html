<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Test</title>
    <style>
      :root { color-scheme: dark; --bg: #15120f; --fg: #e9e1d6; --line: #3a322b; --accent: #d9793a; }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #status { color: #9d9186; margin: 4px 0 12px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .slider { display: block; margin: 6px 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
      button { background: #241e19; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: inherit; text-align: left; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.wide { text-align: center; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>ASHFALL audio audition</h1>
    <div id="app"></div>
    <script type="module" src="./src/audio/devMain.ts"></script>
  </body>
</html>
